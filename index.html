<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GREKKABRAND | Streetwear</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Fuente moderna e industrial (Inter) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Barra de navegación -->
    <header class="navbar">
      <div class="logo">GREKKABRAND</div>
      <nav>
        <ul>
          <li><a href="#">NOVEDADES</a></li>
          <li><a href="#">COLECCIÓN</a></li>
          <li><a href="#">LOOKBOOK</a></li>
        </ul>
      </nav>
      <div class="cart">CARRITO (0)</div>
    </header>

    <!-- Banner principal (Hero Section) -->
    <section class="hero">
      <div class="hero-content">
        <h1>NUEVA COLECCIÓN</h1>
        <p>OVERSIZED ESSENTIALS</p>
        <a href="#shop" class="btn">VER PRODUCTOS</a>
      </div>
    </section>

    <!-- Catálogo de productos -->
    <section class="catalog" id="shop">
      <h2>ÚLTIMOS DROPS</h2>
      <div class="product-grid">
        <div class="product-card">
          <div class="product-image">
            <img
              src="https://via.placeholder.com/600x750/111111/FFFFFF?text=HOODIE+GREKKA"
              alt="Hoodie"
            />
          </div>
          <div class="product-info">
            <h3>HOODIE OVERSIZED BLACK</h3>
            <p class="price">59,99 €</p>
          </div>
        </div>

        <div class="product-card">
          <div class="product-image">
            <img
              src="https://via.placeholder.com/600x750/111111/FFFFFF?text=TEE+GREKKA"
              alt="T-Shirt"
            />
          </div>
          <div class="product-info">
            <h3>HEAVYWEIGHT T-SHIRT WHITE</h3>
            <p class="price">34,99 €</p>
          </div>
        </div>

        <div class="product-card">
          <div class="product-image">
            <img
              src="https://via.placeholder.com/600x750/111111/FFFFFF?text=PANTS+GREKKA"
              alt="Pants"
            />
          </div>
          <div class="product-info">
            <h3>CARGO PANTS GREY</h3>
            <p class="price">69,99 €</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Pie de página -->
    <footer>
      <p>&copy; 2026 GREKKABRAND. TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>
  </body>
</html>
